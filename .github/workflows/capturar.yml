# Captura diaria de precios: barre las tiendas, regenera web/data y sube los cambios.
# Vercel publica de nuevo el sitio cada vez que este flujo hace push.
name: Capturar precios

on:
  schedule:
    - cron: "0 13 * * *"   # 7:00 a. m. en El Salvador (UTC-6)
  workflow_dispatch:        # boton "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: capturar-precios
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: America/El_Salvador   # las fechas de captura quedan en hora local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capturar y exportar
        run: python scripts/precios.py capturar

      - name: Subir cambios
        run: |
          git config user.name "captura-precios[bot]"
          git config user.email "captura-precios@users.noreply.github.com"
          git add data/listados web/data
          if git diff --cached --quiet; then
            echo "Sin cambios de precios hoy."
          else
            git commit -m "Precios del $(date +%F)"
            git push
          fi
