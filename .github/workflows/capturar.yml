# Captura diaria de precios: barre las tiendas, regenera web/data y sube los cambios.
# Vercel publica de nuevo el sitio cada vez que este flujo hace push.
name: Capturar precios

on:
  schedule:
    # GitHub retrasa o salta las tareas a la hora en punto (todo el mundo las usa):
    # minutos "raros" y una segunda corrida de respaldo. Si las dos corren el mismo dia,
    # la segunda solo agrega los precios que cambiaron.
    - cron: "17 12 * * *"  # 6:17 a. m. en El Salvador (UTC-6)
    - cron: "47 19 * * *"  # 1:47 p. m., respaldo
  workflow_dispatch:        # boton "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: capturar-precios
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 90        # 8 min maximo por tienda (ver LIMITE_POR_TIENDA)
    env:
      TZ: America/El_Salvador   # las fechas de captura quedan en hora local
      PYTHONUNBUFFERED: "1"     # el avance ("Barriendo Siman...") se ve en vivo en el log
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Capturar y exportar
        run: python scripts/precios.py capturar

      - name: Subir cambios
        run: |
          git config user.name "captura-precios[bot]"
          git config user.email "captura-precios@users.noreply.github.com"
          git add data/listados web/data
          if git diff --cached --quiet; then
            echo "Sin cambios de precios hoy."
          else
            git commit -m "Precios del $(date +%F)"
            git push
          fi
